<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- archivo css -->
  <link rel="stylesheet" href="../css/styles.css">
  <title>Macetas</title>
  <!-- Fuente Uchen desde Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Uchen&display=swap" rel="stylesheet">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      padding-top: 70px;
      font-family: 'Uchen', serif;
      background-color: #e0f2f1; /* Verde claro */
      color: #1b1b1b;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    main {
      flex: 1;
      padding: 2rem;
      border-radius: 15px;
      margin-top: 2rem;
    }
    .navbar {
      background-color: #81c784 !important;
    }
    .navbar-brand, .nav-link {
      color: white !important;
    }
    .nav-link:hover {
      color: #e8f5e9 !important;
    }
    h1, h2, h3 {
      color: #1b5e20;
    }
    footer {
      background-color: rgba(165, 214, 167, 0.95);
      padding: 1rem;
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-wrap: wrap;
      text-align: center;
    }
    footer img {
      height: 30px;
      margin-right: 0.5rem;
    }
    .social {
      display: flex;
      align-items: center;
      color: #1b1b1b;
      font-weight: bold;
      margin: 0.5rem;
    }
    .mapa {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #1b1b1b;
      font-weight: bold;
      gap: 0.5rem;
    }
    .mapa iframe {
      border: 0;
      width: 200px;
      height: 100px;
      border-radius: 10px;
    }
    .columnas {
      display: flex;
      justify-content: space-around;
      gap: 1rem;
      margin-top: 2rem;
      flex-wrap: wrap;
    }
    .columna {
      text-align: center;
      max-width: 300px;
    }
    .columna img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <!-- Barra de navegación fija -->
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
      <a class="navbar-brand" href="../index.html">VerdeVida</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="acercade.html">Acerca de</a></li>
          <li class="nav-item"><a class="nav-link active" href="macetas.html">Macetas</a></li>
          <li class="nav-item"><a class="nav-link" href="plantas.html">Plantas</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenido principal -->
  <main class="container d-flex flex-column justify-content-center align-items-center text-center">
    <h1>Nuestras Plantas</h1>
    <div class="columnas">
      <!-- Suculentas -->
      <div class="columna">
        <h2>Suculentas</h2>
        <img src="../imagenes/suculenta1.jpeg" alt="Suculenta 1">
        <img src="../imagenes/suculenta2.jpeg" alt="Suculenta 2">
        <img src="../imagenes/suculenta3.jpeg" alt="Suculenta 3">
      </div>
      <!-- Interior -->
      <div class="columna">
        <h2>Interior</h2>
        <img src="../imagenes/interior1.jpeg" alt="Interior 1">
        <img src="../imagenes/interior2.jpeg" alt="Interior 2">
        <img src="../imagenes/interior3.jpeg" alt="Interior 3">
      </div>
      <!-- Exterior -->
      <div class="columna">
        <h2>Exterior</h2>
        <img src="../imagenes/exterior1.jpeg" alt="Exterior 1">
        <img src="../imagenes/exterior2.jpeg" alt="Exterior 2">
        <img src="../imagenes/exterior3.jpeg" alt="Exterior 3">
      </div>
    </div>
  </main>

  <!-- Pie de página -->
  <footer>
    <div class="social">
      <img src="../imagenes/LOGO_IG.jpeg" alt="Instagram">
      <span>@VerdeVida</span>
    </div>
    <div class="social">
      <img src="../imagenes/LOGO_FB.png" alt="Facebook">
      <span>Verde Vida</span>
    </div>
    <div class="mapa">
      <span>Visitanos</span>
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3282.744753606451!2d-58.4193513!3d-34.6345566!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95bccb2e83d52c3b%3A0x89f5e6f8e2491c28!2sParque%20Centenario!5e0!3m2!1ses!2sar!4v1618327082283!5m2!1ses!2sar" allowfullscreen="" loading="lazy"></iframe>
    </div>
  </footer>
